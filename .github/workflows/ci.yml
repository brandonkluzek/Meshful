name: Release verification
run-name: Verify Meshful · ${{ github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22.13
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install exact dependencies
        run: npm --prefix site ci

      - name: Verify release manifest and public-data boundary
        run: npm run check

      - name: Lint
        run: npm --prefix site run lint

      - name: Run complete test suite
        run: npm test
        env:
          # Keep calendar-relative assertions on Meshful's release timezone and
          # avoid GitHub's generic "runner" username becoming a scan keyword.
          TZ: America/Chicago
          HOME: /tmp/meshful-ci-home

      - name: Run focused WebMCP tests
        run: npm run verify:webmcp

      - name: Build production application
        run: npm run build

      - name: Confirm tracked files remain unchanged
        run: git diff --exit-code
